# ╔══════════════════════════════════════════════════════════════════════════╗
# ║ CUMULUS INTELLIGENT - AUTOMATIONS COMPAT                                 ║
# ║ Synchronisation des toggles legacy                                       ║
# ╚══════════════════════════════════════════════════════════════════════════╝

automation:
  - id: cumulus_sync_vacances_compat
    alias: "Cumulus - Sync vacances (compat)"
    description: "Synchronise cumulus_mode_vacances <-> cumulus_vacances"
    mode: queued
    max: 10
    max_exceeded: silent
    trigger:
      - platform: state
        entity_id:
          - input_boolean.cumulus_mode_vacances
          - input_boolean.cumulus_vacances
    condition:
      - condition: template
        value_template: >
          {{ trigger.to_state is not none and trigger.to_state.state in ['on', 'off'] }}
    action:
      - variables:
          desired_state: "{{ trigger.to_state.state }}"
          group_entities:
            - input_boolean.cumulus_mode_vacances
            - input_boolean.cumulus_vacances
          targets: >
            {% set ns = namespace(list=[]) %}
            {% for ent in group_entities %}
              {% if states(ent) != desired_state %}
                {% set ns.list = ns.list + [ent] %}
              {% endif %}
            {% endfor %}
            {{ ns.list }}
      - condition: template
        value_template: "{{ targets | length > 0 }}"
      - service: "input_boolean.turn_{{ desired_state }}"
        target:
          entity_id: "{{ targets }}"

