# Climate Salon avec température Sonoff + fan modes complets
climate:
  - platform: climate_template
    name: "Salon Climate Corrigé"
    unique_id: climate_salon_corrected_template
    
    # Température actuelle = Sonoff (vraie température)
    current_temperature_template: "{{ states('sensor.thermo_salon_temperature') | float(20) }}"
    
    # Humidité actuelle = Sonoff
    current_humidity_template: "{{ states('sensor.thermo_salon_humidity') | int(50) }}"
    
    # Température de consigne = Daikin (TARGET, pas temperature)
    target_temperature_template: "{{ state_attr('climate.daikin_split_salon_room_temperature', 'temperature') | float(20) }}"
    
    # Mode HVAC actuel = Daikin
    hvac_mode_template: "{{ states('climate.daikin_split_salon_room_temperature') }}"
    
    # Fan mode actuel = Daikin
    fan_mode_template: "{{ state_attr('climate.daikin_split_salon_room_temperature', 'fan_mode') }}"
    
    # Modes HVAC disponibles (attention: "modes" pas "hvac_modes")
    modes:
      - 'off'
      - 'heat'
      - 'cool'
      - 'auto'
      - 'dry'
      - 'fan_only'
    
    # Fan modes disponibles
    fan_modes:
      - 'auto'
      - 'quiet'
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
    
    # Limites de température
    min_temp: 16
    max_temp: 30
    precision: 0.5
    temp_step: 0.5
    
    # ACTION: Changer mode HVAC
    set_hvac_mode:
      - service: climate.set_hvac_mode
        data:
          entity_id: climate.daikin_split_salon_room_temperature
          hvac_mode: "{{ hvac_mode }}"
    
    # ACTION: Changer température
    set_temperature:
      - service: climate.set_temperature
        data:
          entity_id: climate.daikin_split_salon_room_temperature
          temperature: "{{ temperature }}"
    
    # ACTION: Changer fan mode
    set_fan_mode:
      - service: climate.set_fan_mode
        data:
          entity_id: climate.daikin_split_salon_room_temperature
          fan_mode: "{{ fan_mode }}"

# Sensor helper pour debug
template:
  - sensor:
      - name: "Salon Écart Température"
        unique_id: salon_temperature_delta_v3
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {{ (state_attr('climate.daikin_split_salon_room_temperature', 'current_temperature') | float(0) 
             - states('sensor.thermo_salon_temperature') | float(0)) | round(1) }}
